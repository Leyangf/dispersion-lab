[project]
name = "dispersionlab"
version = "0.1.0"
description = "Experiments on model-glass dispersion representations (Buchdahl vs Chebyshev)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "jupyter",
    "ipykernel",
    "nbformat",
    "optiland",
    "torch",
    "scikit-learn",
    "pandas",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
optiland = { path = "../optiland", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
